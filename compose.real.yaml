# 接真实上游（百炼）：quotaforge 接入外部网络 qs-qf。由 scripts/compose-real.ps1 使用。
# 上游 Key 只放在当前进程的环境变量 QF_UPSTREAM_API_KEY 里，经 secrets 挂成文件，不出现在 docker inspect 里。
# 数据库密码由脚本每次随机生成，写在 QF_DB_SECRETS_DIR 指向的临时目录里（见 compose.yaml 的 secrets）。
services:
  quotaforge:
    environment:
      QF_UPSTREAM_BASE_URL: ${QF_UPSTREAM_BASE_URL:?set QF_UPSTREAM_BASE_URL to the upstream base URL}
    volumes:
      # 目标路径和 compose.yaml 相同，所以是替换。
      - ./deploy/config.real.json:/etc/quotaforge/config.json:ro
    secrets:
      - upstream_api_key
    # Compose 把来自环境变量的 secret 复制进容器，只读根文件系统的服务不支持。
    # 这里只放开根文件系统；仍以 UID 65532 运行、去掉全部 capability，镜像里没有 shell。
    read_only: false
    networks: [default, qs-qf]

secrets:
  upstream_api_key:
    environment: QF_UPSTREAM_API_KEY

networks:
  qs-qf:
    external: true
